name: PHP Code Checks

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check PHP syntax
        run: find . -name "*.php" -not -path "./vendor/*" | xargs -I{} php -l {}

  phpcs:
    name: PHP CodeSniffer PSR-12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpcs

      - name: Run PHPCS
        run: phpcs --standard=PSR12 --extensions=php --ignore=vendor/ .
